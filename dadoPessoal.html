<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Usuário</title>
    <link rel="stylesheet" href="CSS/dadopessoal.css">
</head>
<body>
    <header class="header">
        <nav>
            <a href="HTML/index.html">
                <img src="logo_sc.png" alt="Service car logo">
            </a>
            <h1>Área do Usuário</h1>
        </nav>
    </header>

    <main>
        
            <aside>
                <h2>
                    <a href="">Dados gerais</a>
                </h2>
                <h2>
                    <a href="">Dados de Pagamento</a>
                </h2>
            </aside>
        
        <div class="main-content">
            
                <img src="logo_sc.png" alt="imagem teste">

            <div class="content">
                <div class="dadosPessoais">
                    <div class="nome">
                        <label for="nome">NOME</label>
                        <br>
                        <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="nome" required>
                    </div>

                    <div class="cpf-nascimento">
                        <div>
                            <form action="">
                                <label for="cpf">CPF</label>
                                <br>
                                <input type="number" id="cpf" placeholder="Digite seu CPF" autocomplete="cpf" required>
                            </form>
                        </div>

                        <div>
                            <form action="">
                                <label for="dataNascimento">DATA DE NASCIMENTO</label>
                                <br>
                                <input type="date" id="dataNascimento" placeholder="Digite sua data de nascimento" autocomplete="dataNascimento" required>
                            </form>
                        </div>
                    </div>
                </div>

                <hr>

                <h2>Contato</h2>

                <div class="contato">
                    <div>
                        <form action="">
                            <label for="email">E-MAIL</label>
                            <br>    
                            <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                        </form>
                    </div>

                    <div>
                        <form action="">
                            <label for="telefone">TELEFONE</label>
                            <br>
                            <input type="tel" id="telefone" placeholder="Digite seu telefone" autocomplete="telefone" required>
                        </form>
                    </div>
                </div>
                <hr>

                <h2>Endereço</h2>

                <div class="Endereço">
                    <div>
                        <form action="">
                            <label for="nome">CEP</label>
                            <br>
                            <input type="text" id="nome" placeholder="Digite seu CEP" autocomplete="nome" required>
                        </form>
                    </div>
                
                    <div class="rua-numero">
                        <div>
                            <form action="">
                                <label for="nome">RUA</label>
                                <br>
                                <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="nome" required>
                            </form>
                        </div>
                    
                    
                        <div>
                            <form action="">
                                <label for="numero">NÚMERO</label>
                                <br>
                                <input type="text" id="numero" placeholder="Digite seu nome" autocomplete="nome" required>
                            </form>
                        </div>
                    </div>

                    <div class="bairro">
                        <form action="">
                            <label for="nome">BAIRRO</label>
                            <br>
                            <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="nome" required>
                        </form>
                    </div>

                    <div class="cidade-estado">
                        <div>
                            <form action="">
                                <label for="nome">CIDADE</label>
                                <br>
                                <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="nome" required>
                            </form>
                        </div>

                        <div>
                            <form action="">
                                <label for="nome">ESTADO</label>
                                <br>
                                <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="nome" required>
                            </form>
                        </div>
                    </div>
                </div> 
            </div>
            <button type="submit">Alterar</button>   
        </div>       
    </main>
</body>
</html>
